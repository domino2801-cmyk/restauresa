# Configuration minimale du CLI Supabase (`supabase start`, `supabase db reset`,
# `supabase functions deploy`). Les autres paramètres prennent leur valeur par défaut.
project_id = "restauresa"

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/reset-password"]

[auth.email]
enable_confirmations = true
otp_length = 6
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "RestauResa — Code de validation"
content_path = "./supabase/templates/confirmation.html"

# Optionnel : envoyer les emails d'authentification (code OTP, réinitialisation)
# via le SMTP de Resend. Décommentez et définissez RESEND_API_KEY dans l'environnement.
# [auth.email.smtp]
# enabled = true
# host = "smtp.resend.com"
# port = 465
# user = "resend"
# pass = "env(RESEND_API_KEY)"
# admin_email = "noreply@votre-domaine.fr"
# sender_name = "RestauResa"

# La connexion par nom est ouverte aux visiteurs non authentifiés.
[functions.login-by-name]
verify_jwt = false

# Email de test via Resend : JWT requis (accès vérifié côté fonction : admin validé).
[functions.send-test-email]
verify_jwt = true

# Rappel hebdomadaire déclenché par GitHub Actions ; authentification par secret dédié.
[functions.weekly-reservation-reminder]
verify_jwt = false
